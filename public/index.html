<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Battleships PoC</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div id="main-page" class="page">
            <div id="page-container" class="container">
                <main class="card">
                    <div id="status-bar" class="status-bar">
                        <div id="status" class="status">Status:&nbsp;<span id="status-value">idle</span></div>
                        <button id="refreshBtn" class="btn icon-btn" title="Refresh Game">
                            <img src="assets/refresh-icon.svg" alt="Refresh" class="refresh-icon" draggable="false" />
                        </button>
                    </div>
                    <div id="gameArea" class="game-area"></div>
                </main>
            </div>

            <footer class="footer">
                <small>Proof of Concept — demo UI</small>
            </footer>
        </div>

        <script src="bundle.js"></script>
    </body>
</html>
