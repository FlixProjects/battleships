AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
    battleships-lambda

    Sample SAM Template for battleships-lambda

Globals:
    Function:
        Timeout: 3
        LoggingConfig:
            LogFormat: JSON
Resources:
    GetGameFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: ../ # we set this to project root so that sam has context of 'shared' folder
            Handler: index.handler
            Runtime: nodejs22.x
            Architectures:
                - x86_64
            Environment:
                Variables:
                    DEPLOY_ENV: local
            Events:
                getGame:
                    Type: Api
                    Properties:
                        Path: /api/
                        Method: post # Note: should actually be 'get' but 'post' for local
        Metadata:
            BuildMethod: esbuild
            BuildProperties:
                Format: esm
                Minify: true
                Target: es2020
                # Sourcemap: true
                OutExtension:
                    - .js=.mjs
                EntryPoints:
                    - battleships-lambda/get-game/index.ts # because we specify project root as CodeUri, we need to be more specific with entrypoint
                External:
                    - "@aws-sdk/client-s3"
    CreateGameFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: ../
            Handler: index.handler
            Runtime: nodejs22.x
            Architectures:
                - x86_64
            Environment:
                Variables:
                    DEPLOY_ENV: local
            Events:
                CreateGame:
                    Type: Api
                    Properties:
                        Path: /api/create
                        Method: post
        Metadata: # Manage esbuild properties
            BuildMethod: esbuild
            BuildProperties:
                Format: esm
                Minify: true
                Target: es2020
                # Sourcemap: true
                OutExtension:
                    - .js=.mjs
                EntryPoints:
                    - battleships-lambda/create-game/index.ts
                External:
                    - "@aws-sdk/client-s3"

    JoinGameFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: ../
            Handler: index.handler
            Runtime: nodejs22.x
            Architectures:
                - x86_64
            Environment:
                Variables:
                    DEPLOY_ENV: local
            Events:
                CreateGame:
                    Type: Api
                    Properties:
                        Path: /api/join
                        Method: post
        Metadata: # Manage esbuild properties
            BuildMethod: esbuild
            BuildProperties:
                Format: esm
                Minify: true
                Target: es2020
                # Sourcemap: true
                OutExtension:
                    - .js=.mjs
                EntryPoints:
                    - battleships-lambda/join-game/index.ts
                External:
                    - "@aws-sdk/client-s3"
    SubmitActionFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: ../
            Handler: index.handler
            Runtime: nodejs22.x
            Architectures:
                - x86_64
            Environment:
                Variables:
                    DEPLOY_ENV: local
            Events:
                CreateGame:
                    Type: Api
                    Properties:
                        Path: /api/submit
                        Method: post
        Metadata: # Manage esbuild properties
            BuildMethod: esbuild
            BuildProperties:
                Format: esm
                Minify: true
                Target: es2020
                # Sourcemap: true
                OutExtension:
                    - .js=.mjs
                EntryPoints:
                    - battleships-lambda/submit-action/index.ts
                External:
                    - "@aws-sdk/client-s3"
    
    SignUpFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: ../
            Handler: index.handler
            Runtime: nodejs22.x
            Timeout: 10 # password hashing + a cold DynamoDB connection can exceed the 3s global
            Architectures:
                - x86_64
            Environment:
                Variables:
                    DEPLOY_ENV: local
                    USERS_TABLE: battleships-users
                    # container-to-container: reachable because sam local start-api
                    # runs with --docker-network battleships-local (see npm run start)
                    DYNAMODB_ENDPOINT: http://dynamodb-local:8000
            Events:
                CreateGame:
                    Type: Api
                    Properties:
                        Path: /api/sign-up
                        Method: post
        Metadata: # Manage esbuild properties
            BuildMethod: esbuild
            BuildProperties:
                Format: esm
                Minify: true
                Target: es2020
                # Sourcemap: true
                OutExtension:
                    - .js=.mjs
                EntryPoints:
                    - battleships-lambda/sign-up/index.ts
                External:
                    - "@aws-sdk/client-s3"
                    - "@aws-sdk/client-dynamodb"
                    - "@aws-sdk/lib-dynamodb"
